<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" role="img" aria-label="Green earth impact">
  <!-- soft clouds -->
  <ellipse cx="40" cy="46" rx="20" ry="9" fill="#C8E6C9" opacity="0.5"/>
  <ellipse cx="56" cy="42" rx="12" ry="7" fill="#C8E6C9" opacity="0.4"/>
  <ellipse cx="162" cy="50" rx="16" ry="8" fill="#C8E6C9" opacity="0.45"/>

  <!-- birds -->
  <path d="M138 28c4 2 7 2 10 0M148 28c4 2 7 2 10 0" stroke="#2E7D32" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M150 38c3 1.5 5.5 1.5 8 0M158 38c3 1.5 5.5 1.5 8 0" stroke="#2E7D32" stroke-width="1.4" stroke-linecap="round"/>

  <!-- globe base -->
  <circle cx="100" cy="82" r="46" fill="#C8E6C9"/>
  <circle cx="100" cy="82" r="46" stroke="#2E7D32" stroke-width="2.4" fill="none"/>

  <!-- oceans tint -->
  <circle cx="100" cy="82" r="44" fill="#A5D6A7" opacity="0.35"/>

  <!-- latitude / longitude -->
  <ellipse cx="100" cy="82" rx="44" ry="14" stroke="#81C784" stroke-width="1.1" opacity="0.55" fill="none"/>
  <ellipse cx="100" cy="82" rx="44" ry="28" stroke="#81C784" stroke-width="1" opacity="0.4" fill="none"/>
  <path d="M100 36v92" stroke="#81C784" stroke-width="1" opacity="0.35"/>
  <path d="M56 82h88" stroke="#81C784" stroke-width="1" opacity="0.35"/>
  <path d="M68 50c10-8 54-8 64 0" stroke="#81C784" stroke-width="1" opacity="0.35" fill="none"/>
  <path d="M68 114c10 8 54 8 64 0" stroke="#81C784" stroke-width="1" opacity="0.35" fill="none"/>

  <!-- continents (Americas / Europe-Africa / Asia) -->
  <path d="M70 62c5-7 12-9 18-5 3 2 5 6 4 11-2 6 0 11 4 14-7 2-13-1-17-6-4-5-7-10-9-14z" fill="#2E7D32"/>
  <path d="M96 54c7-3 14-1 18 4 3 4 2 10-1 13-4 4-3 10 1 13-6 3-13 1-17-4-4-6-5-16-1-26z" fill="#388E3C"/>
  <path d="M118 70c6-2 12 2 14 8 1 5-1 10-5 12-3 2-5 5-3 8-7 0-11-4-13-9-2-6 1-15 7-19z" fill="#2E7D32"/>
  <path d="M78 98c4 2 9 1 11-2 2 4 7 7 12 6-2 5-7 8-12 7-6-1-10-5-11-11z" fill="#43A047"/>

  <!-- subtle leaf accents (small, not turtle fins) -->
  <path d="M54 118c-3 4-4 8-3 11 4-2 8-5 10-9-2-1-4-2-7-2z" fill="#66BB6A" opacity="0.85"/>
  <path d="M146 118c3 4 4 8 3 11-4-2-8-5-10-9 2-1 4-2 7-2z" fill="#66BB6A" opacity="0.85"/>
</svg>
